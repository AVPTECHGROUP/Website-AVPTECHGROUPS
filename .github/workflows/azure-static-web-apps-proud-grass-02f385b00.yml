name: Prod Azure Static Web Apps CI/CD

on:
#  push:
#    branches:
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Write .env.production (prod)
        run: |
          echo "VITE_API_BASE_V1=https://schoolspine-prod-daeyg5dgf3a2drbc.centralindia-01.azurewebsites.net/api/v1" > .env.production
          echo "VITE_API_BASE=https://schoolspine-prod-daeyg5dgf3a2drbc.centralindia-01.azurewebsites.net/api" >> .env.production
          echo "VITE_API_BASE_DOUBLE=https://schoolspine-prod-daeyg5dgf3a2drbc.centralindia-01.azurewebsites.net/api/api" >> .env.production
          echo "VITE_API_BASE_DOUBLE_V1=https://schoolspine-prod-daeyg5dgf3a2drbc.centralindia-01.azurewebsites.net/api/api/v1" >> .env.production
      - name: Build (production)
        run: npm run build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_GRASS_02F385B00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          skip_app_build: true
          ###### End of Repository/Build Configurations ######


